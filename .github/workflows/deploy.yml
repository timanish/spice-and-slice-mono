name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: Deploy frontend to Cloudflare Pages
        type: boolean
        default: true
      deploy_functions:
        description: Deploy edge functions to Supabase
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.check.outputs.frontend }}
      has_functions: ${{ steps.check.outputs.functions }}

    steps:
      - name: Set deploy targets
        id: check
        run: |
          echo "frontend=${{ inputs.deploy_frontend }}" >> $GITHUB_OUTPUT
          echo "functions=${{ inputs.deploy_functions }}" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        if: inputs.deploy_frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_JWKS_ENDPOINT: ${{ secrets.VITE_CLERK_JWKS_ENDPOINT }}
          VITE_CLERK_JWKS_ISSUER: ${{ secrets.VITE_CLERK_JWKS_ISSUER }}
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
        run: npm run build

      - name: Upload build artifact
        if: inputs.deploy_frontend
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy-frontend:
    name: Deploy Frontend
    needs: build
    if: inputs.deploy_frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=spice-and-slice-mono

  deploy-functions:
    name: Deploy Edge Functions
    needs: build
    if: inputs.deploy_functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
